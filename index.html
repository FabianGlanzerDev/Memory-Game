<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/home.css">
    <link rel="stylesheet" href="./styles/settings.css">
    <link rel="stylesheet" href="./styles/game.css">
    <link rel="stylesheet" href="./styles/results.css">

    <script type="module" src="./scripts/main.js"></script>
</head>

<body>
    <main id="app">
        <section class="home-screen" id="home-screen" aria-labelledby="home-title">
            <img class="controller" src="./assets/icons/controller.svg" alt="">

            <div class="home-content">
                <span class="home-subtitle">It's play time.</span>

                <h1 id="home-title">Ready to play?</h1>

                <button class="play-button" id="play-button" type="button">
                    Play →
                </button>
            </div>
        </section>


        <section class="settings-screen hidden" id="settings-screen" aria-labelledby="settings-title">
            <div class="settings-wrapper">
                <div class="settings-options">
                    <h2 id="settings-title">Settings</h2>

                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/themes.svg" alt="">
                            <span>Game themes</span>
                        </legend>

                        <label>
                            <input type="radio" name="theme" value="coding" checked>
                            <span>Code vibes theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="gaming">
                            <span>Gaming theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="projects">
                            <span>DA Projects theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="foods">
                            <span>Foods theme</span>
                        </label>
                    </fieldset>


                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/player.svg" alt="">
                            <span>Choose player</span>
                        </legend>

                        <label>
                            <input type="radio" name="player" value="blue" checked>
                            <span>Blue</span>
                        </label>

                        <label>
                            <input type="radio" name="player" value="orange">
                            <span>Orange</span>
                        </label>
                    </fieldset>


                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/board-size.svg" alt="">
                            <span>Board size</span>
                        </legend>

                        <label>
                            <input type="radio" name="board-size" value="16" checked>
                            <span>16 cards</span>
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="24">
                            <span>24 cards</span>
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="36">
                            <span>36 cards</span>
                        </label>
                    </fieldset>
                </div>


                <div class="settings-preview">
                    <img
                        class="theme-preview"
                        id="theme-preview"
                        src="./assets/img/settings/coding-vibes.svg"
                        alt="Preview of the selected memory theme"
                    >

                    <div class="settings-summary">
                        <span class="settings-summary-value" id="selected-theme">Code vibes theme</span>
                        <span class="summary-divider" aria-hidden="true"></span>

                        <span class="settings-summary-value" id="selected-player">Blue</span>
                        <span class="summary-divider" aria-hidden="true"></span>

                        <span class="settings-summary-value" id="selected-board-size">16 cards</span>

                        <button class="start-button" id="start-button" type="button">
                            <img src="./assets/icons/start.svg" alt="">
                            <span>Start</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>


        <section class="game-screen hidden" id="game-screen" data-theme="coding" data-size="16" aria-label="Memory game">
            <header class="game-header">
                <div class="score-panel" aria-label="Current score" aria-live="polite">
                    <span class="score-badge score-blue">
                        <span class="score-dot" aria-hidden="true"></span>
                        Blue
                        <strong id="blue-score">0</strong>
                    </span>

                    <span class="score-badge score-orange">
                        <span class="score-dot" aria-hidden="true"></span>
                        Orange
                        <strong id="orange-score">0</strong>
                    </span>
                </div>

                <div class="current-player-box" aria-live="polite">
                    <span>Current player:</span>
                    <span class="current-player-indicator" id="current-player-indicator" data-player="blue" aria-hidden="true"></span>
                    <strong id="current-player">Blue</strong>
                </div>

                <button class="exit-button" id="exit-button" type="button">
                    <span aria-hidden="true">↪</span>
                    Exit game
                </button>
            </header>

            <div class="game-board" id="game-board" aria-label="Memory game board"></div>
        </section>


        <div class="exit-modal hidden" id="exit-modal" data-theme="coding" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title" aria-hidden="true">
            <div class="exit-modal-card">
                <h2 id="exit-modal-title">Are you sure you want to quit the game?</h2>

                <div class="exit-modal-actions">
                    <button class="exit-modal-button exit-modal-back" id="back-to-game-button" type="button">
                        Back to game
                    </button>

                    <button class="exit-modal-button exit-modal-confirm" id="confirm-exit-button" type="button">
                        Exit game
                    </button>
                </div>
            </div>
        </div>


        <section class="result-screen game-over-screen hidden" id="game-over-screen" data-theme="coding" aria-live="polite">
            <div class="result-content">
                <h2 id="game-over-title">Game over</h2>
                <p>Final score</p>

                <div class="final-score">
                    <span class="final-score-item final-score-orange">
                        Orange
                        <strong id="game-over-orange-score">0</strong>
                    </span>

                    <span class="final-score-item final-score-blue">
                        Blue
                        <strong id="game-over-blue-score">0</strong>
                    </span>
                </div>
            </div>
        </section>


        <section class="result-screen winner-screen hidden" id="winner-screen" data-theme="coding" aria-live="polite">
            <div class="result-content">
                <p class="winner-kicker" id="winner-kicker">The winner is</p>
                <h2 id="winner-title">Blue Player</h2>

                <span class="result-icon" id="result-icon" data-icon="pawn" aria-hidden="true"></span>

                <button class="new-game-button" id="new-game-button" type="button">
                    New game
                </button>
            </div>
        </section>
    </main>
</body>

</html>
