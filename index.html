<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory</title>

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script src="./scripts/main.js" defer></script>
</head>

<body>
    <main id="app">
        <section class="home-screen" id="home-screen">
            <img
                class="controller"
                src="./assets/icons/controller.svg"
                alt=""
            >

            <div class="home-content">
                <span class="home-subtitle">It's playtime</span>

                <h1>Ready to play?</h1>

                <button class="play-button" id="play-button" type="button">
                    Play →
                </button>
            </div>
        </section>

        <section class="settings-screen hidden" id="settings-screen">
            <h2>Settings</h2>
        </section>
    </main>
</body>
</html>
