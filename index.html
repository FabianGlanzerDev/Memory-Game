<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/style.css">

    <script src="./scripts/main.js" defer></script>
</head>

<body>
    <main id="app">
        <section class="home-screen" id="home-screen">
            <img class="controller" src="./assets/icons/controller.svg" alt="">

            <div class="home-content">
                <span class="home-subtitle">It's play time.</span>

                <h1>Ready to play?</h1>

                <button class="play-button" id="play-button" type="button">
                    Play →
                </button>
            </div>
        </section>


        <section class="settings-screen hidden" id="settings-screen">
            <div class="settings-wrapper">
                <div class="settings-options">
                    <h2>Settings</h2>

                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/themes.svg" alt="">
                            <span>Game themes</span>
                        </legend>

                        <label>
                            <input type="radio" name="theme" value="coding" checked>
                            <span>Code vibes theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="gaming">
                            <span>Gaming theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="projects">
                            <span>DA Projects theme</span>
                        </label>

                        <label>
                            <input type="radio" name="theme" value="foods">
                            <span>Foods theme</span>
                        </label>
                    </fieldset>


                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/player.svg" alt="">
                            <span>Choose player</span>
                        </legend>

                        <label>
                            <input type="radio" name="player" value="blue" checked>
                            <span>Blue</span>
                        </label>

                        <label>
                            <input type="radio" name="player" value="orange">
                            <span>Orange</span>
                        </label>
                    </fieldset>


                    <fieldset class="settings-group">
                        <legend>
                            <img src="./assets/icons/board-size.svg" alt="">
                            <span>Board size</span>
                        </legend>

                        <label>
                            <input type="radio" name="board-size" value="16" checked>
                            <span>16 cards</span>
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="24">
                            <span>24 cards</span>
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="36">
                            <span>36 cards</span>
                        </label>
                    </fieldset>
                </div>


                <div class="settings-preview">
                    <img
                        class="theme-preview"
                        id="theme-preview"
                        src="./assets/img/settings/coding-vibes.svg"
                        alt="Preview of the selected memory theme"
                    >

                    <div class="settings-summary">
                        <span class="settings-summary-value" id="selected-theme">Code vibes theme</span>
                        <span class="summary-divider" aria-hidden="true"></span>

                        <span class="settings-summary-value" id="selected-player">Blue</span>
                        <span class="summary-divider" aria-hidden="true"></span>

                        <span class="settings-summary-value" id="selected-board-size">16 cards</span>

                        <button class="start-button" id="start-button" type="button">
                            <img src="./assets/icons/start.svg" alt="">
                            <span>Start</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
